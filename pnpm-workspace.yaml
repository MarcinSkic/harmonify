# Supply-chain hardening:
# - minimumReleaseAge: a version must be at least 7 days old. Setting it explicitly
#   also turns on minimumReleaseAgeStrict, so a younger version needs an approval
#   prompt (and fails in CI) instead of being silently auto-excluded. For an urgent
#   fix, exclude the exact version: minimumReleaseAgeExclude: ['vite@x.y.z']
# - blockExoticSubdeps / strictDepBuilds: pnpm 11 defaults, spelled out so an older
#   pnpm (e.g. on Vercel) applies them too.
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
# Vercel publishes @vercel/* from GitHub Actions as a trusted publisher but no
# longer attaches provenance, which no-downgrade rejects. Exact versions only, so
# every newer one gets a conscious review before it is let in.
trustPolicyExclude:
  - '@vercel/build-utils@14.23.0'
  - '@vercel/routing-utils@6.6.1'

shellEmulator: true
strictDepBuilds: true

allowBuilds:
  esbuild: true
  vue-demi: true
